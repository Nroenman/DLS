apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: airport
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      initContainers:
        - name: wait-for-gateway
          image: busybox:1.35
          command: ['sh', '-c', 'until nc -z gateway 8080; do echo "waiting for gateway..."; sleep 2; done']
      containers:
        - name: ui
          image: airport/ui:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          env:
            - name: KEYCLOAK_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KEYCLOAK_EXTERNAL_URL
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
