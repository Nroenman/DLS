<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sign Up - Flight Booking</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700">
  <link rel="stylesheet" href="../font-awesome-4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/templatemo-style.css">

  <style>
    .login-page {
      min-height: 720px;
      background: url(../img/banner.jpg) center top no-repeat;
      background-size: cover;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 15px 60px;
    }

    .login-page::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
    }

    .login-box {
      position: relative;
      z-index: 2;
      background: #f5f6f6;
      width: 100%;
      max-width: 470px;
      padding: 40px;
      box-shadow: 0 0 3px rgba(0,0,0,0.15);
      text-align: center;
    }

    .login-box h1 {
      color: #69c6ba;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .login-box p {
      color: #787676;
      margin-bottom: 20px;
    }

    .login-icon {
      font-size: 3rem;
      color: #c66995;
      margin-bottom: 20px;
    }

    .login-btn {
      background: #69c6ba;
      color: white;
      border: none;
      border-radius: 0;
      padding: 14px 25px;
      width: 100%;
      text-transform: uppercase;
      font-weight: 700;
      cursor: pointer;
      display: inline-block;
    }

    .login-btn:hover {
      background: #c66995;
      color: white;
      text-decoration: none;
    }

    .login-btn-secondary {
      background: #fff;
      color: #555;
      border: 2px solid #ccc;
      border-radius: 0;
      padding: 12px 25px;
      width: 100%;
      text-transform: uppercase;
      font-weight: 700;
      cursor: pointer;
      display: inline-block;
    }

    .login-btn-secondary:hover {
      background: #eee;
      color: #333;
      text-decoration: none;
    }

    .login-divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      color: #aaa;
      font-size: 13px;
    }

    .login-divider::before,
    .login-divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid #ddd;
    }

    .login-divider span { padding: 0 12px; }

    .login-small-link {
      display: block;
      margin-top: 20px;
      color: #c66995;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="tm-main-content" id="top">
    <div class="tm-top-bar-bg"></div>

    <div class="tm-top-bar" id="tm-top-bar">
      <div class="container">
        <div class="row">
          <nav class="navbar navbar-expand-lg narbar-light">
            <a class="navbar-brand mr-auto" href="../index.html">
              <img src="../img/logo.png" alt="Site logo">
              Flight Booking
            </a>
            <button type="button" id="nav-toggle" class="navbar-toggler collapsed"
                    data-toggle="collapse" data-target="#mainNav">
              <span class="navbar-toggler-icon"></span>
            </button>
            <div id="mainNav" class="collapse navbar-collapse tm-bg-white">
              <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                  <a class="nav-link external" href="../index.html">Home</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link active" href="signup.html">Sign Up</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="login.html">Login</a>
                </li>
              </ul>
            </div>
          </nav>
        </div>
      </div>
    </div>

    <section class="login-page">
      <div class="login-box">
        <div class="login-icon">
          <i class="fa fa-user-plus"></i>
        </div>

        <h1>Create Account</h1>
        <p>Sign up to start booking flights.</p>

        <button id="googleBtn" class="login-btn" type="button">
          <i class="fa fa-google"></i>&nbsp; Sign up with Google
        </button>

        <div class="login-divider"><span>or</span></div>

        <button id="emailBtn" class="login-btn-secondary" type="button">
          <i class="fa fa-envelope"></i>&nbsp; Sign up with Email
        </button>

        <a class="login-small-link" href="login.html">Already have an account? Sign in</a>
        <a class="login-small-link" href="../index.html">Back to home</a>
      </div>
    </section>

    <footer class="tm-container-outer">
      <p class="mb-0">
        Copyright ©
        <span class="tm-current-year"></span>
        Flight Booking
      </p>
    </footer>
  </div>

  <script src="../js/jquery-1.11.3.min.js"></script>
  <script src="../js/popper.min.js"></script>
  <script src="../js/bootstrap.min.js"></script>

  <script>
    const realm    = "airport-system";
    const clientId = "airport-frontend";

    // Keycloak's registration page serves its own HTML/assets directly from
    // port 8080, so we send the browser there rather than through the nginx proxy.
    const keycloakBase = "http://localhost:8080";

    document.querySelector(".tm-current-year").textContent = new Date().getFullYear();

    function base64UrlEncode(buffer) {
      return btoa(String.fromCharCode(...new Uint8Array(buffer)))
        .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function randomString(length = 64) {
      const arr = new Uint8Array(length);
      crypto.getRandomValues(arr);
      return base64UrlEncode(arr);
    }

    async function sha256(text) {
      return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    }

    async function startPkceFlow(endpoint) {
      const codeVerifier  = randomString(64);
      const codeChallenge = base64UrlEncode(await sha256(codeVerifier));
      localStorage.setItem("pkce_code_verifier", codeVerifier);

      const redirectUri = `${window.location.origin}/pages/callback.html`;

      return `${keycloakBase}/realms/${realm}/protocol/openid-connect/${endpoint}?` +
        new URLSearchParams({
          client_id:             clientId,
          response_type:         "code",
          scope:                 "openid profile email",
          redirect_uri:          redirectUri,
          code_challenge:        codeChallenge,
          code_challenge_method: "S256"
        }).toString();
    }

    document.getElementById("googleBtn").addEventListener("click", async () => {
      const url = await startPkceFlow("auth");
      window.location.href = url + "&kc_idp_hint=google";
    });

    document.getElementById("emailBtn").addEventListener("click", async () => {
      window.location.href = await startPkceFlow("registrations");
    });
  </script>
</body>
</html>
